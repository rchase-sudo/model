<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Page not found · Forma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>
:root{--ink:#0E0E0E;--paper:#F2EFE8;--paper-dim:#A7A296;--gold:#B8924F;--line:rgba(242,239,232,.1);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--paper);font:16px/1.6 "Archivo",Helvetica,Arial,sans-serif}
body{display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;gap:12px;height:64px;padding:0 clamp(16px,5vw,72px);border-bottom:1px solid var(--line)}
header i{width:30px;height:30px;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font:800 13px Archivo,sans-serif;font-style:normal}
header b{letter-spacing:.3em;font-size:13px}
main{flex:1;display:grid;place-items:center;padding:48px clamp(16px,5vw,72px)}
.box{max-width:36rem}
p.k{font:600 11px/1.4 Archivo,sans-serif;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);margin:0 0 16px}
h1{font-weight:800;text-transform:uppercase;font-size:clamp(2rem,6vw,3.2rem);line-height:1;margin:0}
h1 em{font-style:normal;color:var(--gold)}
.lede{color:var(--paper-dim);margin:18px 0 28px}
.row{display:flex;flex-wrap:wrap;gap:12px}
a.btn{display:inline-flex;align-items:center;min-height:50px;padding:0 22px;background:var(--gold);border:1px solid var(--gold);color:var(--ink);font:800 12px Archivo,sans-serif;letter-spacing:.16em;text-transform:uppercase;text-decoration:none}
a.btn.ghost{background:transparent;color:var(--gold)}
</style>
</head>
<body>
<header><i>F</i><b>FORMA</b></header>
<main>
  <div class="box">
    <p class="k">Page not found</p>
    <h1>This page is <em>no longer available.</em></h1>
    <p class="lede">It may have been a preview that's since been retired. See what Forma does for vacant land, or get in touch: support@formadesigns.io · (978) 346-5818.</p>
    <div class="row"><a class="btn" href="https://go.formadesigns.io/">See the Forma package</a><a class="btn ghost" href="https://go.formadesigns.io/work/">Past projects</a></div>
  </div>
</main>
</body>
</html>
